[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "operantkit-cli"
dynamic = ["version"]
description = "Command-line entry point that runs an OperantKit session from one contingency-dsl schedule expression and writes an OKL v1 event log."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "OperantKit contributors" }]
keywords = [
    "behavior-analysis",
    "operant-conditioning",
    "reinforcement-schedule",
    "experiment",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "experiment-core>=0.1.1,<0.2",
    "session-runner>=0.1.1,<0.2",
    "session-recorder>=0.1.1,<0.2",
    "experiment-io>=0.1.1,<0.2",
    "contingency-py>=0.1.1,<0.2",
    "contingency-dsl-py>=0.1.1,<0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "black",
]

[project.scripts]
operant = "operantkit_cli.cli:main"
operantkit-cli = "operantkit_cli.cli:main"

[project.urls]
Homepage = "https://github.com/OperantKit"
Repository = "https://github.com/OperantKit/operantkit-cli"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/operantkit_cli/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/operantkit_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "unit: unit-level tests",
    "integration: integration-level tests spanning modules",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
